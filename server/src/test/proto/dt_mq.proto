syntax = "proto3";
option java_package = "com.github.dtprj.dongting.dtmq.proto";

message MqMessage {
  fixed64 queue_id = 1;
  bytes msg_header = 2; // opaque bytes, not interpreted by the state machine
  bytes msg_body = 3; // maxBody applies to each message body, excluding the header
}

message MqSendReq {
  int32 group_id = 1;
  int32 messages_size = 2;
  repeated MqMessage messages = 3; // one or more messages; batch writes are not atomic
}

message MqSendResp {
  repeated fixed64 raft_indexes = 1 [packed = false]; // request order; sent only when all writes succeed
}

message MqPullQueue {
  fixed64 queue_id = 1;
  fixed64 from_seq = 2; // 0 starts at the earliest readable record
}

message MqPullReq {
  int32 group_id = 1;
  int32 queues_size = 2;
  repeated MqPullQueue queues = 3;
  int32 limit = 4; // shared record limit hint across all queues
  int32 bytes_limit = 5; // shared raw log byte hint (no metadata); first pull record may exceed it
  int64 wait_millis = 6; // 0 disables long polling
}

message MqPullQueueResult {
  fixed64 queue_id = 1;
  fixed64 from_seq = 2;
  fixed64 next_seq = 3;
  int32 count = 4;
  bool truncated = 5; // no records; retry from from_seq
}

message MqPullResp {
  int32 results_size = 1;
  repeated MqPullQueueResult results = 2; // same order as requested queues
  bytes records = 15; // concatenated raw raft log records, grouped by results and delimited by each record's totalLen
}
