syntax = "proto3";
option java_package = "com.github.dtprj.dongting.dtmq.proto";

message MqMessage {
  fixed64 queue_id = 1; // 1-based; 0 is reserved
  bytes msg_header = 2; // opaque bytes, not interpreted by the state machine
  bytes msg_body = 3; // maxBody applies to each message body, excluding the header
}

message MqSendReq {
  int32 group_id = 1;
  int32 messages_size = 2;
  repeated MqMessage messages = 15; // one or more messages; batch writes are not atomic
}

// return EmptyBodyRespFrame

message MqPullReqDetail {
  fixed64 queue_id = 1; // 1-based; 0 is reserved
  fixed64 from_seq = 2; // 0 starts at the earliest readable record
}

message MqPullReq {
  int32 group_id = 1;
  int32 queues_size = 2;
  int32 limit = 3; // shared record limit hint across all queues
  int32 bytes_limit = 4; // shared raw log byte hint (no metadata); any single record may cross it, collection stops once reached
  int64 wait_millis = 5; // 0 disables long polling
  repeated MqPullReqDetail queues = 15;
}

message MqPullRespDetail {
  fixed64 queue_id = 1; // 1-based; 0 is reserved
  fixed64 from_seq = 2; // 0-based
  int32 count = 3; // next pull cursor = from_seq + count
  bool truncated = 4; // no records; retry from from_seq
}

message MqPullResp {
  int32 results_size = 1;
  repeated MqPullRespDetail results = 2; // same order as requested queues
  bytes records = 15; // concatenated raw raft log records, grouped by results and delimited by each record's totalLen
}
